minimum_pre_commit_version: "4.6.0"

repos:
  - repo: local
    hooks:
      - id: check-toolchain-versions
        name: check toolchain version pins
        entry: python scripts/check_toolchain_versions.py
        language: system
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --no-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format --check
        language: system
        types_or: [python, pyi]
