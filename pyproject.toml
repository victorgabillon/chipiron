[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"


[project]
name = "chipiron"
version = "0.2.3"
description = "chipiron plays games"
keywords = ["games", "AI", "torch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
  "PyYAML",
  "PySide6==6.9.2",
  "matplotlib>=3.10.0",
  "plotly>=6.3.0",
  "sortedcollections>=2.1.0",
  "pandas==2.3.2",
  "numpy==2.2.6",
  "numba>=0.61.2",
  "graphviz>=0.20.1",
  "dacite>=1.9.2",
  "customtkinter>=5.2",
  "pyarrow",
  "gprof2dot",
  "mlflow",
  # PyPI distribution names differ from their import packages:
  # parsley-coco -> parsley, algorhino-coral -> coral,
  # algorhino-anemone -> anemone.
  "parsley-coco>=0.1.34",
  "gdown",
  "orjson",
  "zstandard",
  "rich",
  "valanga==0.2.5",
  "atomheart==0.2.11",
  "algorhino-coral==0.1.13",
  "algorhino-anemone==0.2.21",
  "torchinfo",
  "platformdirs>=4.9.2",
  "huggingface_hub>=1.6.0",
  "shakmaty_python_binding",
]


license = "GPL-3.0-only"
license-files = ["LICENSE"]

readme = { file = "README.md", content-type = "text/markdown" }

authors = [{ name = "Victor Gabillon", email = "victorgabillon@gmail.com" }]

[project.optional-dependencies]
test = ["pytest>=9.0.2", "coverage", "pytest-cov>=6.0.0"]

lint = ["ruff==0.15.20", "pylint==4.0.6"]

typecheck = [
  "mypy==2.1.0",
  "pyright[nodejs]==1.1.411",
  "types-PyYAML>=6.0.12.20260518",
]

dev = [
  "tox==4.56.1",
  "black==26.5.1",
  "build==1.5.0",
  "twine",
  "sphinx",
  "sphinx-rtd-theme",
  "sphinx-autodoc-typehints",
  "pre-commit==4.6.0",
]

[project.urls]
Homepage = "https://github.com/victorgabillon/chipiron"
"Bug Tracker" = "https://github.com/victorgabillon/chipiron/issues"


[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }


[tool.setuptools.package-data]
chipiron = [
  "data/players/**/*.yaml",
  "data/players/**/*.pt",
  "data/settings/*.yaml",
  "data/starting_boards/*.text",
  "scripts/learn_nn_supervised/board_evaluators_common_training_data/**/*.yaml", # think about removing this for cleanliness at some point
  "scripts/learn_nn_supervised/board_evaluators_common_training_data/**/*.pt",
  "tests/data/trees/**/*.yaml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chipiron", "chipiron.*"]
exclude = [
  "tests*",
  "docs",
  "examples",
  "build",
  "dist",
  "venv",
  "env",
  ".venv",
  ".env",
  "__pycache__",
  "*.egg-info",
]


[tool.pytest.ini_options]
addopts = "--cov=chipiron --cov-config=pyproject.toml --cov-report=term-missing"
testpaths = ["tests"]
norecursedirs = ["src"]
markers = [
  "integration: marks integration tests (deselect with '-m \"not integration\"')",
  "external_data: tests requiring external downloaded data",
]

[tool.coverage.run]
source = ["chipiron"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
mypy_path = "src"
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true
no_implicit_reexport = true

# Disallow dynamic typing
#disallow_any_unimported = true
#disallow_any_expr = true
#disallow_any_decorated = true
#disallow_any_generics = true
#disallow_any_explicit = true
#disallow_subclassing_any = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# None and optional handling
no_implicit_optional = true

# Configuring warnings
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true

# Misc things
strict_equality = true

# Config file
warn_unused_configs = true


[[tool.mypy.overrides]]
module = ["PySide6"]
ignore_missing_imports = true
follow_imports = 'skip'


[[tool.mypy.overrides]]
module = 'PySide6.*'
follow_imports = 'skip'
ignore_missing_imports = true


[tool.mypy-PySide6]
ignore_missing_imports = true


[tool.ruff]
line-length = 88
target-version = "py313"
fix = false

[tool.ruff.format]
preview = true

[tool.ruff.lint]
# Enable import sorting (alphabetical + group order)
select = [
  "I",
  "F",
  "E",
  "B",
  "TCH",
  "UP",
  "SIM",
  "RUF",
  "RET",
  "N",
  "A",
  "ANN",
  "PERF",
  "TRY",
  "LOG",
  "RSE",
  "ICN",
  "TID",
  "Q",
  "W",
  "D",
  "ISC",
  "PIE",
  "ERA",
  "TD",
] # I = imports, F = pyflakes, E = pycodestyle, TCH = type-checking, B = black

# Allow auto-fixing for imports and type-checking imports
fixable = [
  "I",
  "TCH",
  "F401",
  "UP",
  "SIM",
  "RUF",
  "RET",
  "N",
  "A",
  "TRY",
  "ANN",
  "TID",
  "PERF",
  "PIE",
  "TD",
  "ISC",
  "ERA",
]

# Ignore rules you don't care about
ignore = [
  "E501",
  "ANN401",
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "TD003",
  "TD002",
]

# Optional: add your first-party package to extend the known group
[tool.ruff.lint.per-file-ignores]
# If needed, can add file-specific ignores


[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.pylint]
py-version = "3.13"
extension-pkg-whitelist = ["PyQt5", "PySide6"]

[tool.pylint.format]
max-line-length = 88

#[tool.pylint.messages_control]
disable = [
  "C0301",
  "W0511",
  "R0903",
  "unnecessary-ellipsis",
  "R0902",
  "R0913",
  "R0912",
  "R0915",
  "R0917",
  "R0911",
  "R0914",
  "duplicate-code",
  "invalid-name",
  "import-outside-toplevel",
  "no-name-in-module",
  "too-many-lines",
  "too-many-nested-blocks",
  "too-many-public-methods",
  "undefined-all-variable",
]


[tool.pylint.typecheck]
# Optional: same as init-hook in .pylintrc
init-hook = "import sys; sys.path.append('.')"


[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportPrivateImportUsage = false
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedClass = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryIsInstance = false
reportUnsupportedDunderAll = false
reportDeprecated = false
reportMissingModuleSource = false


#################### TOX ####################

[tool.tox]
min_version = "4.56.1"
env_list = ["tooling", "py313", "lint", "typecheck"]
isolated_build = true


[tool.tox.env_run_base]
base_python = ["python3.13"]

# ----------------
# Tooling drift guard
# ----------------
[tool.tox.env.tooling]
description = "verify pinned local, CI, and pre-commit toolchain versions agree"
package = "skip"
commands = [["python", "scripts/check_toolchain_versions.py"]]

# ----------------
# Tests (realistic)
# ----------------
[tool.tox.env.py313]
deps = ["build==1.5.0"]
description = "Build + install package, run tests"
extras = ["test"]
changedir = "{toxinidir}"
commands_pre = [
  [
    "python",
    "-c",
    "import shutil; shutil.rmtree(r'{toxinidir}/dist', ignore_errors=True)",
  ],
  [
    "python",
    "-m",
    "build",
    "--sdist",
    "--wheel",
    "--outdir",
    "{toxinidir}/dist",
    "{toxinidir}",
  ],
  [
    "python",
    "-c",
    "import shutil, os; src=r'{toxinidir}/tests/data/trees'; dst='external_data/trees'; shutil.copytree(src, dst, dirs_exist_ok=True) if os.path.exists(src) else print(f'Skipping copy: {src} does not exist')",
  ],
  [
    "python",
    "-c",
    "import os; print(os.listdir(r'{toxinidir}/dist'))",
  ],
  [
    "python",
    "-c",
    "import glob, subprocess; subprocess.check_call(['pip','install', glob.glob(r'{toxinidir}/dist/*.tar.gz')[0]])",
  ],
]
commands = [
  [
    "python",
    "-c",
    "import chipiron; print(chipiron.__file__)",
  ],
  [
    "pytest",
    "--basetemp={envtmpdir}/pytest-tmp",
    "-m",
    "not integration and not external_data",
    "{posargs}",
  ],
]

# ----------------
# Lint (fast)
# ----------------
[tool.tox.env.lint]
description = "ruff + pylint (fast)"
package = "editable"
extras = ["lint"]
set_env = { PYTHONPATH = "{toxinidir}/src" }
commands = [
  [
    "python",
    "-m",
    "ruff",
    "format",
    "--check",
    "src/chipiron",
  ],
  [
    "python",
    "-m",
    "ruff",
    "check",
    "src/chipiron",
  ],
  [
    "python",
    "-m",
    "pylint",
    "src/chipiron",
  ],
]

# ----------------
# Typecheck (fast)
# ----------------
[tool.tox.env.typecheck]
description = "mypy + pyright (fast)"
package = "editable"
extras = ["typecheck"]
set_env = { MYPYPATH = "{toxinidir}/src" }
commands = [
  [
    "python",
    "-m",
    "mypy",
    "--strict",
    "src/chipiron",
  ],
  [
    "python",
    "-m",
    "pyright",
    "--pythonpath",
    "{envpython}",
    "src/chipiron",
  ],
]

#################### END TOX ####################
