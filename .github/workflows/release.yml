name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify clean main ancestry and release version
        run: |
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -c 'import os, tomllib; version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + version'

      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev

      - run: python -m pip install -U pip tox==4.56.1 build==1.5.0
      - name: Verify toolchain and formatting
        timeout-minutes: 15
        run: python -m tox -q -e tooling,ruff

      - name: Test installed package
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tox -q -e py313

      - name: Check static-analysis ratchet
        timeout-minutes: 15
        env:
          STATIC_ANALYSIS_BASE_REF: origin/main
        run: python -m tox -q -e static

  publish:
    needs: [quality]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        timeout-minutes: 15
        run: |
          python -m pip install -U pip build==1.5.0 twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import email.parser
          import os
          import pathlib
          import tomllib
          import zipfile

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata_path = next(name for name in wheel.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = email.parser.BytesParser().parsebytes(wheel.read(metadata_path))
          assert metadata["Name"] == "chipiron"
          assert metadata["Version"] == version
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  docker:
    needs: [quality]
    if: github.repository == 'victorgabillon/chipiron' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: victorgabillon/chipiron
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image without publishing
        timeout-minutes: 15
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}

      - name: Check installed package in release image
        timeout-minutes: 15
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python \
            "$IMAGE:$RELEASE_TAG" -c \
            'import chipiron; from chipiron.environments.types import GameKind; print(chipiron.__file__, list(GameKind))'

      - name: Login to Docker Hub after validation
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        timeout-minutes: 15
        run: |
          docker push "$IMAGE:$RELEASE_TAG"
          docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
