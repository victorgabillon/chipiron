name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev

      - run: python -m pip install -U pip tox==4.56.1 build==1.5.0
      - run: python -m tox -q

  publish:
    needs: [quality]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install -U pip build==1.5.0
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  docker:
    needs: [quality]
    if: github.repository == 'victorgabillon/chipiron' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: victorgabillon/chipiron
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}

      - name: Check installed package in release image
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python \
            "$IMAGE:$RELEASE_TAG" -c \
            'import chipiron; from chipiron.environments.types import GameKind; print(chipiron.__file__, list(GameKind))'

      - name: Login to Docker Hub after validation
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the tested image
        run: |
          docker push "$IMAGE:$RELEASE_TAG"
          docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
