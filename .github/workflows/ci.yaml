name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ""
  CHIPIRON_TEST_INSTALLED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_JIT: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - run: python -m pip install pytest==9.2.0
      - name: Select complete, documentation, or authenticated reused validation
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci_validation route
      - uses: actions/upload-artifact@v4
        with:
          name: ci-route-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/validation-route.json
          if-no-files-found: error

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Cache quality tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-quality-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-quality-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Verify toolchain and formatting
        timeout-minutes: 15
        run: python -m tox -e tooling,ruff

  pytest:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    name: pytest (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: full-0, shard: 0}
          - {lane: full-1, shard: 1}
          - {lane: full-2, shard: 2}
          - {lane: full-3, shard: 3}
          - {lane: fast}
          - {lane: pr}
          - {lane: integration}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_TEST_LANE: ${{ matrix.lane }}
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-cpu-constraints.txt
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Cache CPU dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml', '.github/ci-cpu-constraints.txt') }}
          restore-keys: |
            pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Prepare exact scientific dependency source
        run: python .github/scripts/scientific_ci.py prepare
      - name: Build installed test environment
        run: python -m tox -e py314 --notest
      - name: Verify exact installed scientific source
        run: .tox/py314/bin/python .github/scripts/scientific_ci.py verify-candidate "$GITHUB_SHA"
      - name: Preserve candidate identity before tests
        run: |
          cp .ci-reports/scientific-installed-identity.json .ci-reports/identity-before.json
          python .github/scripts/ci_evidence.py
          .tox/py314/bin/python scripts/check_installed_distribution.py
      - name: Collect unchanged unsharded FULL reference
        if: matrix.lane == 'full-0'
        timeout-minutes: 60
        run: |
          python -m tox -e py314 -- --collect-only -n 0 --no-cov --basetemp=${{ runner.temp }}/chipiron-full-reference
          cp .ci-reports/tests.json .ci-reports/full-reference-tests.json
      - name: Test installed package
        if: startsWith(matrix.lane, 'full-')
        timeout-minutes: 60
        run: python -m tox -e py314 -- --basetemp=${{ runner.temp }}/chipiron-py314-pytest --ci-shard-count=4 --ci-shard-index=${{ matrix.shard }}
      - name: Preserve FULL evidence
        if: always() && startsWith(matrix.lane, 'full-')
        run: |
          cp .ci-reports/tests.json .ci-reports/full-tests.json
          cp .ci-reports/pytest.xml .ci-reports/full.xml
          cp .ci-reports/coverage.json .ci-reports/full-coverage.json
          cp .coverage .ci-reports/.coverage
      - name: Independent FAST installed-package feedback
        if: matrix.lane == 'fast'
        timeout-minutes: 45
        run: |
          make test-fast PYTHON=.tox/py314/bin/python TEST_ARGS=--junitxml=.ci-reports/fast.xml
          cp .ci-reports/tests.json .ci-reports/fast-tests.json
      - name: PR installed-package regression lane
        if: matrix.lane == 'pr'
        timeout-minutes: 45
        run: |
          make test-pr PYTHON=.tox/py314/bin/python TEST_ARGS=--junitxml=.ci-reports/pr.xml
          cp .ci-reports/tests.json .ci-reports/pr-tests.json
      - name: Chess and scientific integration contracts
        if: matrix.lane == 'integration'
        env:
          PYTEST_PLUGINS: scripts.ci_test_metrics
          CI_TEST_METRICS_OUTPUT: .ci-reports/integration-tests.json
        timeout-minutes: 30
        run: |
          .tox/py314/bin/python -m pytest --no-cov -n 2 --dist=loadfile tests/integration_test/one_match/test_integration.py tests/environments/test_morpion_continual_training.py tests/environments/test_morpion_continual_publication.py tests/environments/test_morpion_checkpoint_parity.py --junitxml=.ci-reports/scientific-integration.xml
      - name: Verify candidate and dependencies after tests
        if: always()
        run: |
          .tox/py314/bin/python .github/scripts/scientific_ci.py verify-candidate "$GITHUB_SHA"
          cp .ci-reports/scientific-installed-identity.json .ci-reports/identity-after.json
          .tox/py314/bin/python -m pip check
      - name: Strict wheel and sdist metadata
        if: startsWith(matrix.lane, 'full-')
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict .tox/py314/tmp/dist/*
      - name: Record CI environment and disk usage
        if: always()
        run: |
          mkdir -p .ci-reports
          python -m pip cache info
          du -sh ~/.cache/pip .tox || true
          df -h .
          .tox/py314/bin/python -m pip list --format=json > .ci-reports/dependencies.json
          ps -eo pid,ppid,args > .ci-reports/processes-after-tests.txt
      - name: Retain tested distributions
        if: matrix.lane == 'full-0'
        run: cp .tox/py314/tmp/dist/* .ci-reports/
      - name: Seal runtime evidence
        if: always()
        run: .tox/py314/bin/python -m scripts.ci_validation seal
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          include-hidden-files: true

  static:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-cpu-constraints.txt
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.10"
      - name: Cache CPU dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml', '.github/ci-cpu-constraints.txt') }}
          restore-keys: |
            pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Prepare exact scientific dependency source
        run: python .github/scripts/scientific_ci.py prepare
      - name: Build installed static environment
        run: python -m tox -e static --notest
      - name: Verify static scientific dependency source
        run: .tox/static/bin/python .github/scripts/scientific_ci.py verify-static-candidate "$GITHUB_SHA"
      - name: Require clean strict static analysis
        timeout-minutes: 15
        run: |
          mkdir -p .ci-reports
          python -m tox -e static --result-json .ci-reports/static-tox.json
      - name: Retain static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          include-hidden-files: true

  full-evidence:
    needs: [scope, pytest]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - run: python -m pip install pytest==9.2.0 coverage==7.17.0
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-inputs
      - name: Require exact FULL selection and complete installed scientific evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci_validation assemble .ci-inputs
      - name: Combine original line, branch, and subprocess coverage
        run: |
          python -m venv .tox/py314
          .tox/py314/bin/python -m pip install coverage==7.17.0
          .tox/py314/bin/python -m pip install --no-deps .ci-inputs/ci-validation-full-0-*/*.whl
          .tox/py314/bin/python -m coverage combine --keep .ci-inputs/ci-validation-full-*/.coverage
          .tox/py314/bin/python -m coverage json -o .ci-reports/full-coverage.json
          python -m scripts.ci_validation coverage .ci-inputs
      - name: Retain aggregate qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          include-hidden-files: true
          if-no-files-found: error

  test:
    if: ${{ always() }}
    needs: [scope, quality, pytest, static, full-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable validation gate without claiming skipped tests passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VALIDATION_MODE: ${{ needs.scope.outputs.mode }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          EVIDENCE_RESULT: ${{ needs.full-evidence.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$QUALITY_RESULT" = success
          case "$VALIDATION_MODE" in
            full)
              test "$PYTEST_RESULT" = success
              test "$STATIC_RESULT" = success
              test "$EVIDENCE_RESULT" = success
              echo "Complete installed-package validation and FULL selection/coverage verified." >> "$GITHUB_STEP_SUMMARY"
              ;;
            docs|reuse)
              test "$PYTEST_RESULT" = skipped
              test "$STATIC_RESULT" = skipped
              test "$EVIDENCE_RESULT" = skipped
              echo "Validation mode: $VALIDATION_MODE. No runtime tests executed in this run; see authenticated scope evidence." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: ci-route-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-route
      - name: Report the exact scope or reused candidate
        run: cat .ci-route/validation-route.json >> "$GITHUB_STEP_SUMMARY"
