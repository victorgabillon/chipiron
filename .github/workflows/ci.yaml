name: ci

on:
  push:
    branches:
      - main
      - "maintenance/chipiron-canonicalization"
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ""
  CHIPIRON_TEST_INSTALLED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_JIT: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - name: Cache quality tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-quality-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-quality-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Verify toolchain and formatting
        timeout-minutes: 15
        run: python -m tox -e tooling,ruff

  pytest:
    name: pytest (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [full, fast-pr, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI_TEST_LANE: ${{ matrix.lane }}
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-cpu-constraints.txt
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - name: Cache CPU dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml', '.github/ci-cpu-constraints.txt') }}
          restore-keys: |
            pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Prepare exact scientific dependency source
        run: python .github/scripts/scientific_ci.py prepare
      - name: Build installed test environment
        run: python -m tox -e py314 --notest
      - name: Verify exact installed scientific source
        run: .tox/py314/bin/python .github/scripts/scientific_ci.py verify-candidate "$GITHUB_SHA"
      - name: Preserve candidate identity before tests
        run: |
          cp .ci-reports/scientific-installed-identity.json .ci-reports/identity-before.json
          python .github/scripts/ci_evidence.py
          .tox/py314/bin/python scripts/check_installed_distribution.py
      - name: Test installed package
        if: matrix.lane == 'full'
        timeout-minutes: 60
        run: python -m tox -e py314 -- --basetemp=${{ runner.temp }}/chipiron-py314-pytest
      - name: Preserve FULL evidence
        if: always() && matrix.lane == 'full'
        run: |
          cp .ci-reports/tests.json .ci-reports/full-tests.json
          cp .ci-reports/pytest.xml .ci-reports/full.xml
          cp .ci-reports/coverage.json .ci-reports/full-coverage.json
      - name: FAST and PR installed-package lanes
        if: matrix.lane == 'fast-pr'
        timeout-minutes: 45
        run: |
          make test-fast PYTHON=.tox/py314/bin/python TEST_ARGS=--junitxml=.ci-reports/fast.xml
          cp .ci-reports/tests.json .ci-reports/fast-tests.json
          make test-pr PYTHON=.tox/py314/bin/python TEST_ARGS=--junitxml=.ci-reports/pr.xml
          cp .ci-reports/tests.json .ci-reports/pr-tests.json
      - name: Chess and scientific integration contracts
        if: matrix.lane == 'integration'
        env:
          PYTEST_PLUGINS: scripts.ci_test_metrics
          CI_TEST_METRICS_OUTPUT: .ci-reports/integration-tests.json
        timeout-minutes: 30
        run: |
          .tox/py314/bin/python -m pytest --no-cov -n 2 --dist=loadfile tests/integration_test/one_match/test_integration.py tests/environments/test_morpion_continual_training.py tests/environments/test_morpion_continual_publication.py tests/environments/test_morpion_checkpoint_parity.py --junitxml=.ci-reports/scientific-integration.xml
      - name: Verify candidate and dependencies after tests
        if: always()
        run: |
          .tox/py314/bin/python .github/scripts/scientific_ci.py verify-candidate "$GITHUB_SHA"
          cp .ci-reports/scientific-installed-identity.json .ci-reports/identity-after.json
          .tox/py314/bin/python -m pip check
      - name: Strict wheel and sdist metadata
        if: matrix.lane == 'full'
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict .tox/py314/tmp/dist/*
      - name: Record CI environment and disk usage
        if: always()
        run: |
          mkdir -p .ci-reports
          python -m pip cache info
          du -sh ~/.cache/pip .tox || true
          df -h .
          .tox/py314/bin/python -m pip list --format=json > .ci-reports/dependencies.json
          ps -eo pid,ppid,args > .ci-reports/processes-after-tests.txt
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-${{ matrix.lane }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          include-hidden-files: true

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-cpu-constraints.txt
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - name: Cache CPU dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-${{ hashFiles('pyproject.toml', '.github/ci-cpu-constraints.txt') }}
          restore-keys: |
            pip-cpu-v1-${{ runner.os }}-${{ runner.arch }}-py3.14-
      - name: Install system deps (Qt + OpenGL bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            libegl1 libgl1 libglu1-mesa-dev libxrender-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xinerama0 libx11-xcb-dev
      - name: Install pinned quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox==4.67.4 build==1.6.1
      - name: Prepare exact scientific dependency source
        run: python .github/scripts/scientific_ci.py prepare
      - name: Build installed static environment
        run: python -m tox -e static --notest
      - name: Verify static scientific dependency source
        run: .tox/static/bin/python .github/scripts/scientific_ci.py verify-static-candidate "$GITHUB_SHA"
      - name: Require clean strict static analysis
        timeout-minutes: 15
        run: |
          mkdir -p .ci-reports
          python -m tox -e static --result-json .ci-reports/static-tox.json
      - name: Retain static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-static-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          include-hidden-files: true

  test:
    if: ${{ always() }}
    needs: [quality, pytest, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          STATIC_RESULT: ${{ needs.static.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PYTEST_RESULT" = success
          test "$STATIC_RESULT" = success
